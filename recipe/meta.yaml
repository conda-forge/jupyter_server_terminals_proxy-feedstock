{% set version = "0.2.2" %}

package:
  name: jupyter_server_terminals_proxy
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/j/jupyter-server-terminals-proxy/jupyter_server_terminals_proxy-{{ version }}.tar.gz
  sha256: 654bab5a39633f34dce9f6dd4d04d00bfd3ac0510aba6e093e62d31ae37dbd59

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  noarch: python

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - anyio >=4.3.0,<5.0.0
    - httpx2 >=2.13.1,<3.0.0
    - wsproto >=1.2
    - jupyter_server >=1.0.0,<3.0.0

test:
  imports:
    - jupyter_server_terminals_proxy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/davidbrochart/jupyter_server_terminals_proxy
  summary: A Jupyter Server Extension Proxying Terminals.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - davidbrochart
